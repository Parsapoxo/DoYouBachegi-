<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Do You Bachegi?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="version-badge" class="version-badge"></div>

  <!-- ============================ AUTH SCREEN ============================ -->
  <div id="auth-screen">
    <div class="auth-hero">
      <h1 class="site-title">Do You Bachegi?</h1>
      <p class="site-tagline">Which cartoons have you actually seen?</p>
    </div>

    <div class="auth-card">
      <form id="login-form" class="auth-form">
        <h2 class="auth-form-title">Log in</h2>
        <label for="login-username">Username</label>
        <input id="login-username" type="text" autocomplete="username" required />
        <label for="login-password">Password</label>
        <input id="login-password" type="password" autocomplete="current-password" required />
        <p id="login-error" class="form-error"></p>
        <button type="submit" class="btn-primary">Log in</button>
        <p class="switch-form">New here? <a href="#" id="show-signup">Create an account</a></p>
      </form>

      <form id="signup-form" class="auth-form" hidden>
        <h2 class="auth-form-title">Create an account</h2>
        <label for="signup-username">Username</label>
        <input id="signup-username" type="text" autocomplete="username" required />
        <label for="signup-password">Password</label>
        <input id="signup-password" type="password" autocomplete="new-password" required />
        <label>Pick an avatar</label>
        <div id="signup-avatar-grid" class="avatar-grid"></div>
        <p id="signup-error" class="form-error"></p>
        <button type="submit" class="btn-primary">Create account</button>
        <p class="switch-form">Already have an account? <a href="#" id="show-login">Log in</a></p>
      </form>
    </div>
  </div>

  <!-- ============================ APP SCREEN ============================= -->
  <div id="app-screen" hidden>
    <header class="app-header">
      <h1 class="app-title">Do You Bachegi?</h1>
      <div class="app-user">
        <img id="current-avatar" class="current-avatar" alt="your avatar" />
        <span id="current-username" class="current-username"></span>
        <button id="logout-btn" class="btn-secondary">Log out</button>
      </div>
    </header>

    <main id="movie-sections"></main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
